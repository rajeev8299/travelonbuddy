<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!--
    GitHub Pages route restoration and application base.
    This script must execute before relative CSS, icons and scripts.
  -->
  <script>
    (function () {
      var isGitHubPages =
        window.location.hostname === 'rajeev8299.github.io';

      var appBase = isGitHubPages
        ? '/travelonbuddy/'
        : '/';

      var baseElement = document.createElement('base');
      baseElement.href = appBase;

      document.head.insertBefore(
        baseElement,
        document.head.firstChild
      );

      if (!isGitHubPages) return;

      var params = new URLSearchParams(window.location.search);

      if (!params.has('__tob_route')) return;

      var route = params.get('__tob_route') || '';

      route = route.replace(/^\/+/, '');

      if (route.split('/').includes('..')) {
        return;
      }

      var search = params.get('__tob_search') || '';
      var hash = params.get('__tob_hash') || '';

      var restoredUrl = appBase + route + search + hash;

      window.history.replaceState(
        null,
        '',
        restoredUrl
      );
    })();
  </script>

  <link
    rel="icon"
    type="image/png"
    href="%BASE_URL%icon-192x192.png"
  />

  <link
    rel="apple-touch-icon"
    href="%BASE_URL%apple-touch-icon.png"
  />

  <link
    rel="manifest"
    href="%BASE_URL%manifest.json"
  />

  <meta name="theme-color" content="#FF5F1F" />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  />

  <meta
    name="apple-mobile-web-app-title"
    content="TravelOnBuddy"
  />

  <meta
    name="application-name"
    content="TravelOnBuddy"
  />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    TravelOnBuddy — Premium Banaras Companions
  </title>

  <!-- Preserve existing TravelOnBuddy typography. -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

</head>

<body class="bg-[#FAFAF8] text-[#1D1D1F] font-sans antialiased selection:bg-[#F28C28]/20 selection:text-[#EC5800]">

  <div id="root"></div>

  <script
    type="module"
    src="/src/main.tsx"
  ></script>

</body>

</html>
