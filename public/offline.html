<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — TravelOnBuddy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #FAFAF8;
      color: #1D1D1F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E8E8E6;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      display: block;
      object-fit: contain;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1D1D1F;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #6E6E73;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #FF5F1F;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #EC5800;
    }
    .badge {
      display: inline-block;
      background: #FFF7ED;
      color: #FF5F1F;
      border: 1px solid rgba(255, 95, 31, 0.2);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="TravelOnBuddy" class="logo">
    <span class="badge">Connection Notice</span>
    <h1>You're Currently Offline</h1>
    <p>It looks like you've lost internet connection. TravelOnBuddy will automatically reconnect as soon as your network is restored.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
