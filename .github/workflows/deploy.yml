name: Deploy TravelOnBuddy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite & TypeScript Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Compile and Build React + Vite app
        run: npm run build

      - name: Verify build artifacts and SPA fallbacks
        run: |
          test -f dist/index.html || { echo "dist/index.html is missing!"; exit 1; }
          test -f dist/404.html || { echo "dist/404.html is missing!"; exit 1; }
          test -f dist/.nojekyll || { echo "dist/.nojekyll is missing!"; exit 1; }
          test -d dist/assets || { echo "dist/assets directory is missing!"; exit 1; }
          echo "All production artifacts verified successfully."

      - name: Setup GitHub Pages configuration
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy compiled website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
